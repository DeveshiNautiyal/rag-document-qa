services:
  api:
    image: ghcr.io/tony-nyagah/simple_rag:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/documents')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
